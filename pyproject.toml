[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-sunu-sim"
version = "0.1.0"
description = "Fast simulation of low-energy backgrounds (spallation, atmospheric neutrinos) for DSNB studies in Hyper-Kamiokande"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
nb = ["matplotlib", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
